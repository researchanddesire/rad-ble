name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python scripts/generate_protocol.py --check
      - run: pip install platformio
      - run: pio pkg pack .
      - run: pio ci examples/MinimalServer --lib . --board esp32dev
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: RadBLE-*.tar.gz
